services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DB_PATH: /data/chess_league.db
      GOOGLE_CHAT_WEBHOOK_URL: https://chat.googleapis.com/v1/spaces/AAQAyuxnT6U/messages\?key\=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI\&token\=GKTT6OUtQdxDpCzEHalxSJPhWD_tR7bGeJsiA17N32I
    volumes:
      - backend_data:/data
      # 로컬의 기존 DB를 그대로 쓰고 싶으면 위 volume 대신 아래 바인드 마운트를 사용하세요.
      - ./backend/chess_league.db:/data/chess_league.db
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  backend_data:
